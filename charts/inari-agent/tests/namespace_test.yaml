suite: agent namespace
templates:
  - namespace.yaml
tests:
  - it: renders the agent namespace by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: inari-system
  - it: honors a custom namespace
    set:
      namespace: inari-e2e-agent
    asserts:
      - equal:
          path: metadata.name
          value: inari-e2e-agent
  - it: renders nothing when the namespace is pre-provisioned (namespaceCreate=false)
    set:
      namespace: inari-e2e-agent
      namespaceCreate: false
    asserts:
      - hasDocuments:
          count: 0
