suite: oidcSecret ExternalSecret
templates:
  - externalsecret.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the ExternalSecret when enabled
    set:
      oidcSecret.create: true
      oidcSecret.secretStore: inari-platform
      oidcSecret.remotePath: inari/clusters/abc-123/oidc-client-secret
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: external-secrets.io/v1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: inari-agent-oidc-client
      - equal:
          path: metadata.namespace
          value: inari-system
      - equal:
          path: spec.secretStoreRef.name
          value: inari-platform
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: inari-agent-oidc-client
      - equal:
          path: spec.data[0].secretKey
          value: client-secret
      - equal:
          path: spec.data[0].remoteRef.key
          value: inari/clusters/abc-123/oidc-client-secret
      - equal:
          path: spec.data[0].remoteRef.property
          value: client-secret
  - it: honors name/key/kind overrides
    set:
      oidcSecret.create: true
      oidcSecret.name: custom-secret
      oidcSecret.key: password
      oidcSecret.secretStore: tenant-store
      oidcSecret.secretStoreKind: SecretStore
      oidcSecret.remotePath: inari/clusters/xyz/oidc-client-secret
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret
      - equal:
          path: spec.target.name
          value: custom-secret
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.data[0].secretKey
          value: password
