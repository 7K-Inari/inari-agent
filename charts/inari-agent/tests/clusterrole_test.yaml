suite: gitops ClusterRole
templates:
  - clusterrole.yaml
tests:
  - it: grants ArgoCD applications AND applicationsets (Feature C fleet addons)
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: ["argoproj.io"]
            resources: ["applications", "applicationsets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - it: grants read-only watches for the server-rendered platform resources (status streamer)
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["identity.inari.io"]
            resources: ["tenantrealms", "tenantclients"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["stacks.inari.io"]
            resources: ["tenantnamespaces"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["cert-manager.io"]
            resources: ["clusterissuers"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["externaldns.k8s.io"]
            resources: ["dnsendpoints"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["argoproj.io"]
            resources: ["appprojects"]
            verbs: ["get", "list", "watch"]
  - it: drops the retired platform.inari.io CRD watches (operator sunset Phase 4, D7)
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["platform.inari.io"]
