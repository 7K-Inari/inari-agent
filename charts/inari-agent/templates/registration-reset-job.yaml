# One-shot Job (registrationReset=true): patches the persisted registration
# ConfigMap to the in-cluster h2c control plane and restarts the agent pod so
# it re-reads it. Rendered as a normal resource (ArgoCD PreSync hooks only run
# inside an explicit sync operation — a hook-only diff never triggers one).
{{- if .Values.registrationReset }}
apiVersion: batch/v1
kind: Job
metadata:
  name: inari-agent-registration-reset-v2
  namespace: {{ .Values.namespace }}
  annotations:
    # Jobs are immutable: a changed template must replace, not patch.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: reset
          image: registry.k8s.io/kubectl:v1.31.0
          command:
            - /bin/sh
            - -ec
            - |
              kubectl -n {{ .Values.namespace }} patch configmap inari-agent-registration \
                --type merge -p '{"data":{"control-plane":"http://inari-server.{{ .Values.controlPlaneNamespace | default "inari" }}.svc:8080"}}'
              kubectl -n {{ .Values.namespace }} delete pod -l app.kubernetes.io/name={{ .Chart.Name }} --wait=false
{{- end }}
