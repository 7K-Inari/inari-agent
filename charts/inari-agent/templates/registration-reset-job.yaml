# One-shot PreSync Job: resets the persisted registration's control-plane to
# the in-cluster h2c endpoint. Rendered only when registrationReset=true; the
# pre-upgrade hook ordering guarantees the patch lands before the agent pod
# rolls. The inari-agent-managed Role already grants configmaps patch.
{{- if .Values.registrationReset }}
apiVersion: batch/v1
kind: Job
metadata:
  name: inari-agent-registration-reset
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: patch
          image: bitnami/kubectl:1.31
          command:
            - kubectl
            - -n
            - {{ .Values.namespace | quote }}
            - patch
            - configmap
            - inari-agent-registration
            - --type
            - merge
            - -p
            - '{"data":{"control-plane":"http://inari-server.{{ .Values.controlPlaneNamespace | default "inari" }}.svc:8080"}}'
{{- end }}
