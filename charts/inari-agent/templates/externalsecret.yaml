# OIDC client secret projection (plan §5.3): ESO pulls the per-cluster secret
# the control plane wrote to Vault during the registration exchange. Opt-in —
# on clusters without ESO installed the CRD does not exist; ArgoCD keeps
# retrying the sync until external-secrets is installed post-registration.
{{- if .Values.oidcSecret.create }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidcSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "inari-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.oidcSecret.secretStore }}
    kind: {{ .Values.oidcSecret.secretStoreKind }}
  target:
    name: {{ .Values.oidcSecret.name }}
  data:
    - secretKey: {{ .Values.oidcSecret.key }}
      remoteRef:
        key: {{ .Values.oidcSecret.remotePath }}
        property: {{ .Values.oidcSecret.key }}
{{- end }}
# Tunnel client secret projection (plan §8): same ESO pattern as above for
# the tunnel-<cluster-id> client-credentials secret the kubeproxy-issued
# JWTs are minted from.
{{- if and .Values.kubectlTunnel.enabled .Values.kubectlTunnel.oidcSecret.create }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kubectlTunnel.secret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "inari-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kubectlTunnel.oidcSecret.secretStore }}
    kind: {{ .Values.kubectlTunnel.oidcSecret.secretStoreKind }}
  target:
    name: {{ .Values.kubectlTunnel.secret.name }}
  data:
    - secretKey: {{ .Values.kubectlTunnel.secret.key }}
      remoteRef:
        key: {{ .Values.kubectlTunnel.oidcSecret.remotePath }}
        property: {{ .Values.kubectlTunnel.secret.key }}
{{- end }}
