# Read-only discovery watches (plan §5.3).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inari-agent-discovery
  labels:
    {{- include "inari-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositedresourcedefinitions", "compositions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kro.run"]
    resources: ["resourcegraphdefinitions"]
    verbs: ["get", "list", "watch"]
  # Platform-cluster CRDs reconciled by inari-operator (status streamer,
  # M3/M7): read-only condition watch.
  - apiGroups: ["platform.inari.io"]
    resources: ["keycloakrealms", "keycloakclients", "dnszones", "dnsrecords", "tenantnamespaces"]
    verbs: ["get", "list", "watch"]
  # Helm releases: watched only in namespaces listed in
  # INARI_HELM_NAMESPACES (no cluster-wide secrets read — least privilege).
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # Addon version discovery.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
