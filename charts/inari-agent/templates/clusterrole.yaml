# Read-only discovery watches (plan §5.3).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inari-agent-discovery
  labels:
    {{- include "inari-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositedresourcedefinitions", "compositions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kro.run"]
    resources: ["resourcegraphdefinitions"]
    verbs: ["get", "list", "watch"]
  # Server-rendered platform resources (status streamer, operator sunset
  # ADR-0017): provider-keycloak TenantRealm/TenantClient claims and the
  # KRO tenantnamespace instance — read-only condition watch.
  - apiGroups: ["identity.inari.io"]
    resources: ["tenantrealms", "tenantclients"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stacks.inari.io"]
    resources: ["tenantnamespaces"]
    verbs: ["get", "list", "watch"]
  # Native platform resources rendered hub-side (status streamer).
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
  # Helm releases: watched only in namespaces listed in
  # INARI_HELM_NAMESPACES (no cluster-wide secrets read — least privilege).
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # Addon version discovery.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # ArgoCD Applications: status streamer (app health/sync reporting),
  # invoke-action ownership checks (inari.dev/managed-by label), and
  # register-argocd-app command handling (create/update/delete of
  # Inari-managed Applications). ApplicationSets: fleet addon deployments
  # (Feature C) — the agent upserts server-rendered manifests verbatim.
  # AppProjects are read-only here (status stream); mutations stay with
  # the gitops ClusterRole in config/rbac.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    verbs: ["get", "list", "watch"]
