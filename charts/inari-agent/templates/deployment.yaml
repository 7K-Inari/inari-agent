apiVersion: apps/v1
kind: Deployment
metadata:
  name: inari-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "inari-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inari-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inari-agent
        app.kubernetes.io/part-of: inari
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if ge (int .Values.replicas) 2 }}
      # HA posture: prefer spreading pods across nodes and zones (soft
      # constraints — a single-node cluster must still schedule).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: inari-agent
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inari-agent
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          env:
            - name: INARI_REGISTRATION_TOKEN
              value: {{ .Values.config.registrationToken | quote }}
            - name: INARI_TENANT_ID
              value: {{ .Values.config.tenantID | quote }}
            - name: INARI_CONTROL_PLANE
              value: {{ .Values.config.controlPlane | quote }}
            - name: INARI_CLUSTER_LABELS
              value: {{ .Values.config.clusterLabels | quote }}
            - name: INARI_HELM_NAMESPACES
              value: {{ .Values.config.helmNamespaces | quote }}
            {{- with .Values.config.readyzDisconnectGrace }}
            - name: INARI_READYZ_DISCONNECT_GRACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
