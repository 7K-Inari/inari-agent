namespace: inari-system

image:
  repository: ghcr.io/7k-inari/inari-agent
  tag: latest
  pullPolicy: IfNotPresent

# Single replica by default (dev posture). Production HA posture:
#   replicas: 2
#   leaderElection:
#     enabled: true
# ACTIVE-PASSIVE ONLY. Do NOT run active-active: the agent has no
# session fencing and the command journal only bounds (does not
# eliminate) double command execution; server-side fencing is handled
# separately (inari-server).
replicas: 1

# Leader election (coordination.k8s.io Lease in the agent namespace).
# Required for replicas > 1 so only one pod runs the lifecycle.
leaderElection:
  enabled: false

# Rendered only when replicas >= 2 (voluntary-disruption budget for the
# HA posture; harmless and absent in the single-replica default).
pdb:
  minAvailable: 1

# Footprint budget (plan §5.3, §12.1/4). Enforced by CI footprint guard.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  name: inari-agent

# Lifecycle configuration (plan §5.3). registrationToken is the one-time
# TTL'd bootstrap token issued by the control plane; leave empty for
# standalone mode.
config:
  registrationToken: ""
  tenantID: ""
  controlPlane: ""
  # Comma-separated k=v labels (ClusterSet targeting).
  clusterLabels: ""
  # Namespaces whose Helm release Secrets are discovered (least privilege).
  helmNamespaces: "inari-system"
  # Optional override for INARI_READYZ_DISCONNECT_GRACE (Go duration,
  # default 90s): how long /readyz tolerates a control-plane stream
  # disconnect before flapping unready. Empty uses the built-in default.
  readyzDisconnectGrace: ""

# OIDC client secret delivery (plan §5.3): when enabled, renders an
# ExternalSecret that projects the per-cluster OIDC client secret the control
# plane wrote to Vault during the registration exchange. Opt-in: on clusters
# without ESO installed the CRD does not exist yet — under ArgoCD the sync
# retries until external-secrets is installed post-registration; plain
# `helm install` users should only enable this when ESO is present.
oidcSecret:
  create: false
  name: inari-agent-oidc-client
  key: client-secret
  # SecretStore/ClusterSecretStore the ExternalSecret pulls from.
  secretStore: ""
  secretStoreKind: ClusterSecretStore
  # Vault path, e.g. inari/clusters/<cluster-id>/oidc-client-secret.
  remotePath: ""

# Extra INARI_* env entries (e.g. INARI_ARGOCD_API_URL/INARI_ARGOCD_API_TOKEN
# for invoke-action against the tenant-local ArgoCD).
extraEnv: []

# One-shot control-plane reset for the persisted registration ConfigMap
# (renders a PreSync patch Job). Flip back to false after it succeeds.
registrationReset: false
