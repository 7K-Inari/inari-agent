namespace: inari-system

image:
  repository: ghcr.io/7k-inari/inari-agent
  tag: latest
  pullPolicy: IfNotPresent

# Single replica by default (dev posture). Production HA posture:
#   replicas: 2
#   leaderElection:
#     enabled: true
# ACTIVE-PASSIVE ONLY. Do NOT run active-active: the agent has no
# session fencing and the command journal only bounds (does not
# eliminate) double command execution; server-side fencing is handled
# separately (inari-server).
replicas: 1

# Leader election (coordination.k8s.io Lease in the agent namespace).
# Required for replicas > 1 so only one pod runs the lifecycle.
leaderElection:
  enabled: false

# Rendered only when replicas >= 2 (voluntary-disruption budget for the
# HA posture; harmless and absent in the single-replica default).
pdb:
  minAvailable: 1

# Footprint budget (plan §5.3, §12.1/4). Enforced by CI footprint guard.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  name: inari-agent

# Lifecycle configuration (plan §5.3). registrationToken is the one-time
# TTL'd bootstrap token issued by the control plane; leave empty for
# standalone mode.
config:
  registrationToken: ""
  tenantID: ""
  controlPlane: ""
  # Comma-separated k=v labels (ClusterSet targeting).
  clusterLabels: ""
  # Namespaces whose Helm release Secrets are discovered (least privilege).
  helmNamespaces: "inari-system"
  # Optional override for INARI_READYZ_DISCONNECT_GRACE (Go duration,
  # default 90s): how long /readyz tolerates a control-plane stream
  # disconnect before flapping unready. Empty uses the built-in default.
  readyzDisconnectGrace: ""

# OIDC client secret delivery (plan §5.3): when enabled, renders an
# ExternalSecret that projects the per-cluster OIDC client secret the control
# plane wrote to Vault during the registration exchange. Opt-in: on clusters
# without ESO installed the CRD does not exist yet — under ArgoCD the sync
# retries until external-secrets is installed post-registration; plain
# `helm install` users should only enable this when ESO is present.
oidcSecret:
  create: false
  name: inari-agent-oidc-client
  key: client-secret
  # SecretStore/ClusterSecretStore the ExternalSecret pulls from.
  secretStore: ""
  secretStoreKind: ClusterSecretStore
  # Vault path, e.g. inari/clusters/<cluster-id>/oidc-client-secret.
  remotePath: ""

# Extra INARI_* env entries (e.g. INARI_ARGOCD_API_URL/INARI_ARGOCD_API_TOKEN
# for invoke-action against the tenant-local ArgoCD).
extraEnv: []

# One-shot control-plane reset for the persisted registration ConfigMap
# (renders a PreSync patch Job). Flip back to false after it succeeds.
registrationReset: false

# Kubectl tunnel relay (plan §8): the in-cluster agent that dials out to
# inari-kubeproxy and relays proxied kubectl traffic to the tenant
# apiserver via hub-minted Impersonate-* headers. Runs as a dedicated
# binary/Deployment with its own ServiceAccount holding ONLY the
# impersonate verb — never merged into the inari-agent SA. Footprint is
# deliberately small: it is a thin byte relay (the 100m/128Mi CI guard
# applies per Deployment).
kubectlTunnel:
  enabled: true
  # Kubeproxy base URL the tunnel agent dials (pull, never push).
  # Required for the tunnel to function; the pod fails fast when empty.
  kubeproxyURL: ""
  # Cluster identifier (logging; the cluster_id claim itself is hardcoded
  # in the tunnel client's JWT).
  clusterID: ""
  # Keycloak issuer for the tunnel-<cluster-id> client; the token URL is
  # derived as {oidcIssuer}/protocol/openid-connect/token unless
  # oidcTokenURL is set explicitly.
  oidcIssuer: ""
  oidcTokenURL: ""
  # OIDC client ID; empty derives tunnel-<clusterID>.
  clientID: ""
  # Apiserver override; empty uses https://kubernetes.default.svc.
  apiserverURL: ""
  # Session keepalive (Go duration, default 30s).
  pingInterval: ""
  # Per-connection byte cap in bytes (default 1GiB; no windowing in v1).
  maxConnBytes: ""
  # Per-connection lifetime cap (Go duration, default 60m = hub reaper).
  maxConnLifetime: ""
  image:
    # Empty inherits the top-level image.tag (same image, second binary).
    tag: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  # ESO-delivered tunnel client secret (client-credentials for the
  # tunnel-<cluster-id> Keycloak client) consumed as env vars.
  secret:
    name: inari-tunnel-agent-oidc-client
    key: client-secret
  # Optional ExternalSecret projecting the tunnel client secret; mirrors
  # the top-level oidcSecret pattern (opt-in for ESO-less clusters).
  oidcSecret:
    create: false
    secretStore: ""
    secretStoreKind: ClusterSecretStore
    # Vault path, e.g. inari/clusters/<cluster-id>/tunnel-client-secret.
    remotePath: ""
