version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
  settings:
    govet:
      disable:
        # New in go1.27; reports "cannot inline: type parameter inference is
        # not yet supported" on go-github v92 generic calls (github.Ptr).
        - inline
    - ineffassign
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports
