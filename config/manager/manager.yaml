apiVersion: apps/v1
kind: Deployment
metadata:
  name: inari-agent
  labels:
    app.kubernetes.io/name: inari-agent
    app.kubernetes.io/part-of: inari
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inari-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inari-agent
        app.kubernetes.io/part-of: inari
    spec:
      serviceAccountName: inari-agent
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          # Lifecycle configuration (plan §5.3). The server's
          # install-manifest endpoint renders the inari-agent-config Secret
          # with the one-time registration token; without it the agent runs
          # standalone and healthy.
          envFrom:
            - secretRef:
                name: inari-agent-config
                optional: true
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          # Footprint budget (plan §5.3, §12.1/4): enforced by CI footprint guard.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
