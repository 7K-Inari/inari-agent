# Namespaced rights in the agent's own namespace (plan §5.3): read the
# ESO-delivered OIDC client-secret and Helm release Secrets owned by Inari.
# Broader mutation rights land with the M2 command handlers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inari-agent-managed
  labels:
    app.kubernetes.io/name: inari-agent
    app.kubernetes.io/part-of: inari
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
