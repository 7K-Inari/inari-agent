# M2 GitOps mutation rights (plan §5.3): the agent manages tenant-local
# ArgoCD Applications/AppProjects (argoproj.io/v1alpha1 only, per the M1
# spike conditions) and reads KRO instance resources for the status
# streamer. Mutations are fenced by the Inari ownership label at runtime
# (brownfield observe-only default, §12.1/3).
#
# Note: KRO instance reads target groups discovered at runtime; grant
# additional per-RGD read Roles when tenants render instances whose CRDs
# live outside this list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inari-agent-gitops
  labels:
    app.kubernetes.io/name: inari-agent
    app.kubernetes.io/part-of: inari
rules:
  # ArgoCD Applications/AppProjects: register + status stream.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Bundle-managed ArgoCD install (server-side apply of pinned manifests).
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "update", "patch"]
  # KRO instance watches (status streamer). kro.run covers the RGDs
  # themselves; generated instance groups must be granted per-RGD.
  - apiGroups: ["kro.run"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
