# Read-only discovery watches (plan §5.3). The catalog is a projection of
# reality: capability sources are observed, never mutated by the agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inari-agent-discovery
  labels:
    app.kubernetes.io/name: inari-agent
    app.kubernetes.io/part-of: inari
rules:
  # CRDs (OpenAPI v3 schemas)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # OLM ClusterServiceVersions
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
  # Crossplane XRDs, Compositions, providers
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositedresourcedefinitions", "compositions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers"]
    verbs: ["get", "list", "watch"]
  # KRO ResourceGraphDefinitions
  - apiGroups: ["kro.run"]
    resources: ["resourcegraphdefinitions"]
    verbs: ["get", "list", "watch"]
  # Helm releases: release metadata lives in Secrets labelled owner=helm, and
  # RBAC cannot scope list/watch by label — a cluster-wide secrets grant
  # would read EVERY cluster secret (dropped deliberately in M0). M1 watches
  # Helm Secrets only in namespaces listed in INARI_HELM_NAMESPACES
  # (default: inari-system), granted via the namespaced managed Role below.
  # Cluster metadata
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # Addon version discovery (kube-system and other platform deployments).
  # Deployment specs carry no credentials.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
