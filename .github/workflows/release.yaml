name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless OIDC

env:
  IMAGE: ghcr.io/7k-inari/inari-agent
  CHART_OCI: oci://ghcr.io/7k-inari/charts

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - run: go test ./... -coverprofile cover.out
      - run: hack/check-footprint_test.sh

  image:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAGS="type=raw,value=${TAG}"
          # :latest only for stable releases, never pre-releases.
          if [[ "$TAG" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"type=raw,value=latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/7K-Inari/inari-agent
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Keyless-sign image digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${IMAGE}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  provenance:
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ env.IMAGE }}
      digest: ${{ needs.image.outputs.digest }}

  manifests:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - name: Set up kustomize v5.4.3
        run: |
          curl -fsSL -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf kustomize.tgz
          mkdir -p "$HOME/.local/bin"
          mv kustomize "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: helm/setup-helm@v4
      - name: Render install manifest pinned to the release image
        run: |
          make manifests
          # Pin the rendered manifest to the released image tag.
          sed -i "s|ghcr.io/7k-inari/inari-agent:latest|${IMAGE}:${GITHUB_REF_NAME}|" dist/install.yaml
          hack/check-footprint.sh --manifest dist/install.yaml
      - name: Package and push Helm chart (OCI)
        run: |
          sed -i "s/^version:.*/version: ${GITHUB_REF_NAME#v}/" charts/inari-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/inari-agent/Chart.yaml
          helm package charts/inari-agent -d dist
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm push dist/inari-agent-${GITHUB_REF_NAME#v}.tgz "$CHART_OCI"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/install.yaml
          generate_release_notes: true
