name: release-please

# PR-only mode: opens/updates the Release PR (version bump + CHANGELOG.md).
# Never creates tags, GitHub Releases, or publishes anything.
# See docs/release.md for the full release flow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        # release.yml creates the tag asynchronously on the same push; without
        # this guard, recomputing now would re-propose the just-released
        # commits with a bumped version (duplicate changelog) — the
        # version-drift loop. On the next ordinary push the tag exists and the
        # computation is correct.
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping release-please"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: googleapis/release-please-action@v4
        with:
          # PAT (if configured) so the Release PR triggers ci.yaml like a normal
          # PR; falls back to GITHUB_TOKEN (PR then won't trigger CI — see
          # docs/release.md "Prerequisites").
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
