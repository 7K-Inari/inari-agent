name: edge

# Per-merge edge releases: every push to main builds and pushes the agent
# image as ghcr.io/7k-inari/inari-agent:<pending>-<shortsha> (plus the
# moving :edge and :edge-<sha> tags) and cuts a GitHub prerelease. Skipped on
# release merges — release.yml covers that commit.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/7k-inari/inari-agent

concurrency:
  group: edge-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping edge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.v.outputs.edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve edge version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "edge=$(scripts/resolve-edge-version.sh .)" >> "$GITHUB_OUTPUT"

  edge-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.version.outputs.edge }}
          tags: |
            ${{ env.IMAGE }}:edge-${{ github.sha }}
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ needs.version.outputs.edge }}

  chart:
    # Publish the chart at the same per-commit edge version (semver
    # prerelease, e.g. 0.5.2-a1b2c3d) — edge publishes the IMAGE on every
    # main merge but historically never the CHART, so chart-level changes
    # (e.g. the discovery.name/namespaceCreate knobs, #88) had to wait for a
    # stable release to be consumable from oci://ghcr.io/7k-inari/charts.
    # Same registry-login pattern as release.yml; packages:write is already
    # on the workflow. Release merges are skipped upstream by the gate job.
    needs: version
    runs-on: ubuntu-latest
    env:
      EDGE: ${{ needs.version.outputs.edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: Package and push the edge chart (OCI)
        run: |
          set -euo pipefail
          # Chart version: unprefixed semver (helm); appVersion: the
          # v-prefixed edge image tag (release.yml convention).
          sed -i "s/^version:.*/version: ${EDGE}/" charts/inari-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"v${EDGE}\"/" charts/inari-agent/Chart.yaml
          helm package charts/inari-agent -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/inari-agent-${EDGE}.tgz" oci://ghcr.io/7k-inari/charts

  prerelease:
    needs: [version, edge-image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create edge prerelease + move the edge channel tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGE: ${{ needs.version.outputs.edge }}
        run: |
          set -euo pipefail
          if gh release view "v${EDGE}" > /dev/null 2>&1; then
            echo "prerelease v${EDGE} already exists — skipping create (workflow rerun)"
          else
            gh release create "v${EDGE}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "edge ${EDGE}" \
              --notes "Edge build from ${GITHUB_SHA}. Image: \`${{ env.IMAGE }}:${EDGE}\` (also \`:edge\`, \`:edge-${GITHUB_SHA}\`). Chart: \`oci://ghcr.io/7k-inari/charts/inari-agent:${EDGE}\`. Superseded by the next stable vX.Y.Z release."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          if gh release view edge > /dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge (v${EDGE})" \
              --notes "Latest edge build: \`v${EDGE}\` (${GITHUB_SHA})."
          else
            gh release create edge --prerelease --target "$GITHUB_SHA" \
              --title "edge (v${EDGE})" \
              --notes "Latest edge build: \`v${EDGE}\` (${GITHUB_SHA})."
          fi
