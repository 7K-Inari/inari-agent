name: edge

# Per-merge edge releases: every push to main builds and pushes the agent
# image as ghcr.io/7k-inari/inari-agent:<pending>-edge.<shortsha> (plus the
# moving :edge and :edge-<sha> tags) and cuts a GitHub prerelease. Skipped on
# release merges — release.yml covers that commit.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/7k-inari/inari-agent

concurrency:
  group: edge-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping edge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.v.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve edge version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "edge=$(scripts/resolve-edge-version.sh .)" >> "$GITHUB_OUTPUT"

  edge-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.version.outputs.edge }}
          tags: |
            ${{ env.IMAGE }}:edge-${{ github.sha }}
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ needs.version.outputs.edge }}

  prerelease:
    needs: [version, edge-image]
    runs-on: ubuntu-latest
    steps:
      - name: Create edge prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGE: ${{ needs.version.outputs.edge }}
        run: |
          gh release create "v${EDGE}" \
            --prerelease \
            --title "edge ${EDGE}" \
            --notes "Edge build from ${GITHUB_SHA}. Image: \`${{ env.IMAGE }}:${EDGE}\` (also \`:edge\`, \`:edge-${GITHUB_SHA}\`). Superseded by the next stable vX.Y.Z release."
