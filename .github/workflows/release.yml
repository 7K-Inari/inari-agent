name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike), creates tag + GitHub Release, then
# runs verify/publish jobs gated on the action's outputs. No tag-push
# triggers, no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write # cosign keyless OIDC

env:
  IMAGE: ghcr.io/7k-inari/inari-agent
  CHART_OCI: oci://ghcr.io/7k-inari/charts

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  verify:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce semver version
        run: |
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "version $VERSION is not semver (X.Y.Z)"; exit 1; }

      - name: Go module path consistent with major version
        run: |
          MAJOR="${VERSION%%.*}"
          MODULE=$(go mod edit -json | jq -r '.Module.Path')
          if [ "$MAJOR" -ge 2 ]; then
            case "$MODULE" in */v"$MAJOR") ;; *) echo "go.mod module $MODULE missing /v$MAJOR suffix"; exit 1;; esac
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - run: go test ./... -coverprofile cover.out
      - run: hack/check-footprint_test.sh


  image:
    needs: [release, verify]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          TAGS="${IMAGE}:${TAG}"
          # :latest only for stable releases, never pre-releases.
          if [[ "$TAG" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/7K-Inari/inari-agent
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Keyless-sign image digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${IMAGE}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  provenance:
    needs: [release, image]
    if: needs.release.outputs.released == 'true'
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      # env context is unavailable in reusable-workflow `with:` — hardcode.
      image: ghcr.io/7k-inari/inari-agent
      digest: ${{ needs.image.outputs.digest }}

  manifests:
    needs: [release, verify, image]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up kustomize v5.4.3
        run: |
          curl -fsSL -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf kustomize.tgz
          mkdir -p "$HOME/.local/bin"
          mv kustomize "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: helm/setup-helm@v4
      - name: Render install manifest pinned to the release image
        run: |
          make manifests
          # Pin the rendered manifest to the released image tag.
          sed -i "s|ghcr.io/7k-inari/inari-agent:latest|${IMAGE}:${TAG}|" dist/install.yaml
          hack/check-footprint.sh --manifest dist/install.yaml
      - name: Package and push Helm chart (OCI)
        run: |
          sed -i "s/^version:.*/version: ${TAG#v}/" charts/inari-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG}\"/" charts/inari-agent/Chart.yaml
          helm package charts/inari-agent -d dist
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm push dist/inari-agent-${TAG#v}.tgz "$CHART_OCI"
      - name: Attach install manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/install.yaml --clobber
